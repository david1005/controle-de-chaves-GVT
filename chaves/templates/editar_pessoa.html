{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirada de Chave</title>
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}" />
    <link rel="icon" type="image/x-icon" href="{% static 'images/icon-home.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% include 'navbar.html' %}

    <div class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3 pagina-form">
    <a href="{% url 'lista_pessoas' %}" class="btn btn-voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </a>
    <div class="card shadow-lg border-0 form-card">
        <div class="card-body p-4 p-md-5">

        <h2 class="fw-bold mb-1">Editar Pessoa</h2>
        <div class="barra-horizontal mb-4"></div>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="post" action="{% url 'editar_pessoa' pessoa.id %}" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="preview-foto flex-shrink-0">
                    {% if pessoa.foto %}
                    <img src="{{ pessoa.foto.url }}" alt="Foto de {{ pessoa.nome }}">
                    {% else %}
                    <i class="fa-solid fa-user"></i>
                    {% endif %}
                </div>
                <div>
                    <label for="foto" class="btn btn-outline-dark btn-sm">
                    <i class="fa-solid fa-camera me-1"></i> Trocar foto
                    </label>
                    <input type="file" id="foto" name="foto" accept="image/*" class="d-none">
                </div>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nome" name="nome" value="{{ pessoa.nome }}" placeholder="Nome completo">
                <label for="nome">Nome Completo</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="cargo" name="cargo" value="{{ pessoa.cargo }}" placeholder="Cargo">
                <label for="cargo">Cargo</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="matricula" name="matricula" value="{{ pessoa.matricula }}" placeholder="Matrícula">
                <label for="matricula">Matrícula</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase btn-salvar mt-2">
                Salvar Alterações
            </button>
        </form>

        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
