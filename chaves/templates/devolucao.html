<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devolução de Chave</title>
    <link rel="stylesheet" href="../static/css/devolucao.css" />
    <link rel="icon" type="image/x-icon" href="../static/images/icon-cadastro.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-custom px-3">
    <div class="container-fluid">
        <a class="navbar-brand">Controle de Chaves</a>
        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#menuNav"
        aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                <a class="nav-link" href= "{%  url 'inicio'  %}">
                    <i class="fa-solid fa-house me-1"></i> Início
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'retirada' %}">
                    <i class="fa-solid fa-key me-1"></i> Retirada
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'registrar_devolucao' %}">
                    <i class="fa-solid fa-rotate-left me-1"></i> Devolução
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'cadastrar_chave' %}">
                    <i class="fa-solid fa-user-plus me-1"></i> Cadastro
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'relatorio' %}">
                    <i class="fa-solid fa-file-lines me-1"></i> Relatórios
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'lista_chaves' %}">
                    <i class="fa-solid fa-list-check"></i> Chaves
                </a>
                </li>
            </ul>

        <ul class="navbar-nav">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
            <i class="fa-solid fa-circle-user me-2" style="font-size: 1.4rem;"></i>
            <span>João Silva</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" href="{% url 'inicio' %}"><i class="fa-solid fa-right-from-bracket me-2"></i>Sair</a></li>
            </ul>
        </li>
        </ul>
        </div>

    </div>
    </nav>

    <div class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3">
    <button type="button" class="btn btn-voltar" onclick="window.history.back()">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </button>
    <div class="card shadow-lg border-0 form-card">
        <div class="card-body p-4 p-md-5">

        <h2 class="fw-bold mb-1">Devolução de Chave</h2>
        <div class="barra-horizontal mb-4"></div>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        {% if movimentacoes %}
        <form method="post" action="{% url 'registrar_devolucao' %}">
            {% csrf_token %}
            <div class="form-floating mb-4">
                <select class="form-select" id="chave" name="chave" required>
                    <option value="" selected disabled>Selecione a chave a devolver</option>
                    {% for mov in movimentacoes %}
                    <option value="{{ mov.chave.id }}">
                        Chave {{ mov.chave.codigo }} — com {{ mov.pessoa.nome }} desde {{ mov.data_hora_retirada|date:"d/m/Y H:i" }}
                    </option>
                    {% endfor %}
                </select>
                <label for="chave">Chave em aberto</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase btn-salvar">
                <i class="fa-solid fa-rotate-left me-2"></i>Confirmar Devolução
            </button>
        </form>
        {% else %}
        <p class="text-muted">Não há chaves em aberto no momento.</p>
        {% endif %}

        </div>
    </div>
    </div>
</body>
</html>
