{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/icon-cadastro.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-custom px-3">
    <div class="container-fluid">
        <a class="navbar-brand">Controle de Chaves</a>
        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#menuNav"
        aria-controls="menuNav" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                <a class="nav-link" href= "{%  url 'inicio'  %}">
                    <i class="fa-solid fa-house me-1"></i> Início
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'retirada' %}">
                    <i class="fa-solid fa-key me-1"></i> Retirada
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'registrar_devolucao' %}">
                    <i class="fa-solid fa-rotate-left me-1"></i> Devolução
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'cadastrar_chave' %}">
                    <i class="fa-solid fa-user-plus me-1"></i> Cadastro
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'relatorio' %}">
                    <i class="fa-solid fa-file-lines me-1"></i> Relatórios
                </a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href= "{% url 'lista_chaves' %}">
                    <i class="fa-solid fa-list-check"></i> Chaves
                </a>
                </li>
            </ul>

        <ul class="navbar-nav">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
            <i class="fa-solid fa-circle-user me-2 icon-perfil"></i>
            <span>João Silva</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" href="{% url 'inicio' %}"><i class="fa-solid fa-right-from-bracket me-2"></i>Sair</a></li>
            </ul>
        </li>
        </ul>
        </div>

    </div>
    </nav>

    <div class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3 pagina-form">
    <button type="button" class="btn btn-voltar" onclick="window.history.back()">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </button>
    <div class="card shadow-lg border-0 form-card">
        <div class="card-body p-4 p-md-5">

        <h2 class="fw-bold mb-1">Novo Cadastro</h2>
        <div class="barra-horizontal mb-4"></div>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <ul class="nav nav-pills nav-fill gap-2 mb-4" id="tipoTab" role="tablist">
            <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-chave" data-bs-toggle="pill"
                    data-bs-target="#secao-chave" type="button" role="tab">
                <i class="fa-solid fa-key d-block mb-1 fs-4"></i>
                Chave
            </button>
            </li>
            <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-pessoa" data-bs-toggle="pill"
                    data-bs-target="#secao-pessoa" type="button" role="tab">
                <i class="fa-solid fa-user d-block mb-1 fs-4"></i>
                Pessoa
            </button>
            </li>
        </ul>

        <form id="form-cadastro" method="post" enctype="multipart/form-data"
              action="{% url 'cadastrar_chave' %}" data-url-chave="{% url 'cadastrar_chave' %}"
              data-url-pessoa="{% url 'cadastrar_pessoa' %}" novalidate>
            {% csrf_token %}
            <input type="hidden" name="tipo_cadastro" id="tipo_cadastro" value="chave">

            <div class="tab-content" id="tipoTabContent">

            <div class="tab-pane fade show active" id="secao-chave" role="tabpanel">

                <div class="form-floating mb-3">
                <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Código da chave">
                <label for="codigo">Código da Chave</label>
                </div>

                <div class="form-floating mb-3">
                <select class="form-select" id="local" name="local">
                    <option value="" selected>Selecione o local</option>
                    <option value="lab1">Laboratório 1</option>
                    <option value="lab2">Laboratório 2</option>
                    <option value="lab3">Laboratório 3</option>
                    <option value="lab4">Laboratório - Ciências</option>
                    <option value="lab5">Laboratório - Hardware</option>
                    <option value="lab6">Laboratório - Enfermagem</option>
                </select>
                <label for="local">Local</label>
                </div>

                <label class="form-label d-block mb-2">Status</label>
                <div class="btn-group w-100 mb-3" role="group" aria-label="Status da chave">
                <input type="radio" class="btn-check" name="status" id="status-ativa" value="ativa" checked>
                <label class="btn btn-outline-success" for="status-ativa">
                    <i class="fa-solid fa-circle-check me-1"></i>Ativa
                </label>

                <input type="radio" class="btn-check" name="status" id="status-inativa" value="inativa">
                <label class="btn btn-outline-danger" for="status-inativa">
                    <i class="fa-solid fa-circle-xmark me-1"></i>Inativa
                </label>
                </div>

                <div class="form-floating mb-3">
                <textarea class="form-control textarea-observacoes" id="observacoes" name="observacoes"
                            placeholder="Observações"></textarea>
                <label for="observacoes">Observações</label>
                </div>

            </div>


            <div class="tab-pane fade" id="secao-pessoa" role="tabpanel">

                <div class="d-flex align-items-center gap-3 mb-4">
                <div class="preview-foto flex-shrink-0">
                    <img id="preview-img" src="" alt="Preview" class="d-none">
                    <i class="fa-solid fa-user" id="preview-icon"></i>
                </div>
                <div>
                    <label for="foto" class="btn btn-outline-dark btn-sm">
                    <i class="fa-solid fa-camera me-1"></i> Escolher foto
                    </label>
                    <input type="file" id="foto" name="foto" accept="image/*" class="d-none">
                </div>
                </div>

                <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome completo">
                <label for="nome">Nome Completo</label>
                </div>

                <div class="form-floating mb-3">
                <input type="text" class="form-control" id="cargo" name="cargo" placeholder="Cargo">
                <label for="cargo">Cargo</label>
                </div>

                <div class="form-floating mb-3">
                <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Matrícula">
                <label for="matricula">Matrícula</label>
                </div>

            </div>

            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase btn-salvar mt-2">
            Salvar Cadastro
            </button>
        </form>

        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/cadastro.js' %}"></script>
</body>
</html>
