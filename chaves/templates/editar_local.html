{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar Local</title>
	<link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
	<link rel="icon" type="image/x-icon" href="{% static 'images/icon-home.png' %}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
	{% include 'navbar.html' %}

	<div class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3 pagina-form">
		<a href="{% url 'lista_locais' %}" class="btn btn-voltar">
			<i class="fa-solid fa-arrow-left"></i> Voltar
		</a>

		<div class="card shadow-lg border-0 form-card">
			<div class="card-body p-4 p-md-5">
				<h2 class="fw-bold mb-1">Editar Local</h2>
				<div class="barra-horizontal mb-4"></div>

				{% if messages %}
					{% for message in messages %}
						<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}">
							{{ message }}
						</div>
					{% endfor %}
				{% endif %}

				<form method="post" action="{% url 'editar_local' local.id %}" novalidate>
					{% csrf_token %}

					<div class="form-floating mb-3">
						<input type="text" class="form-control" id="nome" name="nome" value="{{ local.nome }}" placeholder="Nome do local" required>
						<label for="nome">Nome do Local</label>
					</div>

					<button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase btn-salvar mt-2">
						Salvar Alterações
					</button>
				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
